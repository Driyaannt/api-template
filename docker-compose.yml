services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: backend_driya, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["1025:1025", "8025:8025"]
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    env_file: .env
    environment: { DATABASE_URL: postgresql://postgres:postgres@postgres:5432/backend_driya }
    ports: ["3000:3000"]
    depends_on: [postgres]
volumes: { postgres-data: {} }
